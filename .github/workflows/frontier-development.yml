name: Frontier Development | Quality Gate

# Development is intentionally never pushed straight to main. The normal
# upstream CI only runs on main and pull requests, leaving this branch's
# engine/client graphics changes unvalidated by GitHub Actions.
on:
  push:
    branches:
      - frontier/development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontier:
    name: Engine + HUD + Cinematic checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout development code
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: npm 12
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install locked dependencies
        run: npm ci
      - name: Check every TypeScript package
        run: npm run typecheck
      - name: Validate Ultra naval GLSL in every graphics profile
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends glslang-tools
          node scripts/validateUltraNavalGlsl.mjs
      - name: Build the development client
        run: npm run build-dev
      - name: Verify Ultra naval quality isolation and fleet contracts
        run: |
          npx vitest run --project client \
            tests/client/render/gl/UltraNavalVisualContract.test.ts \
            tests/client/render/gl/UnitPassFleet.test.ts \
            tests/client/render/gl/VesselMotionDynamics.test.ts \
            tests/client/render/gl/NavalWaypoint.test.ts
      - name: Check carrier rendering and pre-game player colors
        run: |
          npx vitest run --project node --project client \
            tests/Privilege.test.ts \
            tests/UserSettings.test.ts \
            tests/client/PlayerColors.test.ts \
            tests/client/UsernameInputValidation.test.ts \
            tests/client/CosmeticsFetchTimeout.test.ts \
            tests/client/render/gl/UnitPassFleet.test.ts
      - name: Check Geopolitics defense construction and wire encoding
        run: |
          npx vitest run --project node \
            tests/core/game/PackedUnitUpdates.test.ts \
            tests/GeopoliticsDefenseWire.test.ts \
            tests/GeopoliticsAdvancedDefenses.test.ts \
            tests/FunctionalGeopoliticsCapital.test.ts \
            tests/FunctionalShipyard.test.ts \
            tests/CastleDefense.test.ts \
            tests/Geopolitics.test.ts
      - name: Check responsive HUD regression tests
        run: |
          npx vitest run --project client \
            tests/client/DlcBuildShortcuts.test.ts \
            tests/client/UnitDisplay.test.ts \
            tests/client/FrontierHudLayout.test.ts \
            tests/client/CastleDefensePanel.test.ts \
            tests/client/SinglePlayerModalStart.test.ts \
            tests/client/NavalStatusPanel.test.ts
      - name: Check defense gameplay, build shortcuts, HUD and GPU regressions
        run: |
          npx vitest run --project client --project node \
            tests/GeopoliticsAdvancedDefenses.test.ts \
            tests/client/DlcBuildShortcuts.test.ts \
            tests/client/UnitDisplay.test.ts \
            tests/client/FrontierHudLayout.test.ts \
            tests/client/controllers/BuildPreviewController.test.ts \
            tests/client/render/gl/IronDomeVisibility.test.ts \
            tests/client/render/gl/DefenseCoveragePerf.test.ts \
            tests/CinematicFxVisibility.test.ts
